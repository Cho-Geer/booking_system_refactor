version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  # Redis Cache & BullMQ
  redis:
    image: redis:7-alpine
    container_name: booking-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - booking-network

  # Backend API
  backend:
    build:
      context: ./booking-backend
      dockerfile: Dockerfile.dev
    container_name: booking-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/booking_db?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRATION: 1h
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_REFRESH_EXPIRATION: 7d
      PORT: 3000
      CORS_ORIGIN: http://localhost:4200
      LOG_LEVEL: ${LOG_LEVEL:-log}
    ports:
      - '3000:3000'
    volumes:
      - ./booking-backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - booking-network
    command: sh -c 'npx prisma migrate deploy && (npx prisma db seed || true) && npm run start:dev'
    env_file:
      - ./booking-backend/.env

volumes:
  postgres-data:
  redis-data:

networks:
  booking-network:
    driver: bridge
