name: Reusable Deploy Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (staging, production)'
        required: true
        type: string
      service:
        description: 'Service to deploy (backend, frontend, all)'
        required: false
        type: string
        default: 'all'
      image_tag:
        description: 'Docker image tag to deploy (defaults to latest for the branch)'
        required: false
        type: string
        default: ''
      run_migrations:
        description: 'Whether to run database migrations before deployment'
        required: false
        type: boolean
        default: true
      run_health_check:
        description: 'Whether to run health checks after deployment'
        required: false
        type: boolean
        default: true
      health_check_url:
        description: 'Health check URL endpoint'
        required: false
        type: string
        default: 'http://localhost:3000/v1/health'
      health_check_timeout:
        description: 'Timeout in seconds for health check retries'
        required: false
        type: number
        default: 120
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      DEPLOY_SSH_KEY:
        description: 'SSH key for deployment server'
        required: false
      DEPLOY_HOST:
        description: 'Deployment server hostname'
        required: true
      DEPLOY_USER:
        description: 'Deployment server user'
        required: true
      PROD_DATABASE_URL:
        description: 'Production database URL (required for production environment)'
        required: false
      PROD_REDIS_URL:
        description: 'Production Redis URL'
        required: false

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://booking.example.com' || 'https://staging.booking.example.com' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          case "${{ inputs.environment }}" in
            staging|production)
              echo "Deploying to ${{ inputs.environment }} environment"
              ;;
            *)
              echo "Error: Invalid environment '${{ inputs.environment }}'. Must be 'staging' or 'production'."
              exit 1
              ;;
          esac

      - name: Determine image tag
        id: image_tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup deployment directory
        run: |
          mkdir -p deploy/${{ inputs.environment }}
          cp deploy/env/${{ inputs.environment }}.env.example deploy/${{ inputs.environment }}/.env 2>/dev/null || true

      - name: Deploy backend
        if: inputs.service == 'all' || inputs.service == 'backend'
        run: |
          echo "Deploying backend to ${{ inputs.environment }}..."

          # Pull the latest image
          docker pull ghcr.io/${{ github.repository_owner }}/booking-backend:${{ steps.image_tag.outputs.tag }}

          # Run migrations if enabled
          if [ "${{ inputs.run_migrations }}" = "true" ]; then
            echo "Running database migrations..."
            docker run --rm \
              --network host \
              -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL || 'postgresql://user:pass@localhost:5432/booking_system' }}" \
              ghcr.io/${{ github.repository_owner }}/booking-backend:${{ steps.image_tag.outputs.tag }} \
              npx prisma migrate deploy
          fi

          # Start the backend container
          docker run -d \
            --name booking-backend-${{ inputs.environment }} \
            --restart unless-stopped \
            --network host \
            -e NODE_ENV=${{ inputs.environment == 'production' && 'production' || 'development' }} \
            -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL || 'postgresql://user:pass@localhost:5432/booking_system' }}" \
            -e REDIS_URL="${{ secrets.PROD_REDIS_URL || 'redis://localhost:6379' }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}" \
            ghcr.io/${{ github.repository_owner }}/booking-backend:${{ steps.image_tag.outputs.tag }}

          echo "Backend deployed successfully."
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}

      - name: Deploy frontend
        if: inputs.service == 'all' || inputs.service == 'frontend'
        run: |
          echo "Deploying frontend to ${{ inputs.environment }}..."

          # Pull the latest image
          docker pull ghcr.io/${{ github.repository_owner }}/booking-frontend:${{ steps.image_tag.outputs.tag }}

          # Start the frontend container
          docker run -d \
            --name booking-frontend-${{ inputs.environment }} \
            --restart unless-stopped \
            -p 80:80 \
            ghcr.io/${{ github.repository_owner }}/booking-frontend:${{ steps.image_tag.outputs.tag }}

          echo "Frontend deployed successfully."

      - name: Health check
        if: inputs.run_health_check
        run: |
          echo "Running health checks..."
          TIMEOUT=${{ inputs.health_check_timeout }}
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            if curl -sf "${{ inputs.health_check_url }}" > /dev/null 2>&1; then
              echo "Health check passed!"
              curl -sf "${{ inputs.health_check_url }}" | head -c 500
              exit 0
            fi
            echo "Waiting for health check... (${ELAPSED}s/${TIMEOUT}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          echo "Health check failed after ${TIMEOUT}s"
          echo "=== Backend logs ==="
          docker logs booking-backend-${{ inputs.environment }} --tail 50 || true
          exit 1

      - name: Verify deployment
        if: inputs.run_health_check
        run: |
          echo "Verifying deployment..."

          # Check backend container is running
          if docker inspect booking-backend-${{ inputs.environment }} > /dev/null 2>&1; then
            echo "Backend container is running"
            docker inspect booking-backend-${{ inputs.environment }} --format='Image: {{.Config.Image}}'
          fi

          # Check frontend container is running
          if docker inspect booking-frontend-${{ inputs.environment }} > /dev/null 2>&1; then
            echo "Frontend container is running"
            docker inspect booking-frontend-${{ inputs.environment }} --format='Image: {{.Config.Image}}'
          fi

          echo "Deployment verification complete."

      - name: Generate deployment report
        if: always()
        run: |
          echo "## Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: ${{ inputs.service }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: ${{ steps.image_tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Migrations**: ${{ inputs.run_migrations && 'Yes' || 'No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: ${{ inputs.run_health_check && 'Yes' || 'No' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment to ${{ inputs.environment }} FAILED!"
          echo "Image Tag: ${{ steps.image_tag.outputs.tag }}"
          echo "Commit: ${{ github.sha }}"
          echo "Check the logs for more details."

          # Collect failure diagnostics
          echo "=== Container status ==="
          docker ps -a || true
          echo "=== Backend logs ==="
          docker logs booking-backend-${{ inputs.environment }} --tail 100 2>/dev/null || true
          echo "=== Frontend logs ==="
          docker logs booking-frontend-${{ inputs.environment }} --tail 100 2>/dev/null || true
