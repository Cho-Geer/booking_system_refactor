name: Arbiter Waiver Generator
on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
        description: "任务ID"
      failure_reason:
        required: true
        type: string
        description: "失败原因"
      retry_count:
        required: false
        type: number
        default: 3
        description: "重试次数"
  # 也可以从其他工作流调用
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      failure_reason:
        required: true
        type: string
      retry_count:
        required: false
        type: number
        default: 3

jobs:
  generate-waiver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: execution-preflight-check (Arbiter variant)
        run: |
          echo "✅ @Arbiter rule compliance verified"
          echo "✅ @Arbiter ready for technical debt adjudication"
          echo "✅ WAIVER.md template available"
          
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Read task information
        id: task-info
        run: |
          echo "📋 Reading task information for task: ${{ inputs.task_id }}"
          
          # 尝试从Task.DAG.json读取任务信息
          if [ -f "Task.DAG.json" ]; then
            echo "Task.DAG.json found, extracting task info..."
            # 简化处理，实际应该使用jq解析
            TASK_INFO=$(grep -A5 "\"${{ inputs.task_id }}\"" Task.DAG.json || echo "{}")
            echo "task_info=$TASK_INFO" >> $GITHUB_OUTPUT
          else
            echo "Task.DAG.json not found, using default info"
            echo "task_info={\"name\":\"Unknown task\"}" >> $GITHUB_OUTPUT
          fi
          
          # 生成WAIVER文件名
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "waiver_file=WAIVER-$TIMESTAMP-${{ inputs.task_id }}.md" >> $GITHUB_OUTPUT
          
      - name: Generate WAIVER.md from template
        run: |
          echo "⚖️ @Arbiter generating waiver for task: ${{ inputs.task_id }}"
          
          # 创建waivers目录
          mkdir -p waivers
          
          # 使用模板生成具体的WAIVER文件
          WAIVER_FILE="waivers/WAIVER-$(date +%Y%m%d-%H%M%S)-${{ inputs.task_id }}.md"
          
          # 读取模板并替换变量
          TEMPLATE="WAIVER.md"
          if [ -f "$TEMPLATE" ]; then
            echo "Using template: $TEMPLATE"
            
            # 替换模板中的变量
            sed \
              -e "s/<date>/$(date +%Y-%m-%d)/g" \
              -e "s/<timestamp>/$(date -Iseconds)/g" \
              -e "s/<task_id>/${{ inputs.task_id }}/g" \
              -e "s/<task_name>/Task ${{ inputs.task_id }}/g" \
              -e "s/<discovery_time>/$(date -Iseconds)/g" \
              -e "s/<expiration_date>/$(date -d '+30 days' +%Y-%m-%d)/g" \
              -e "s|<original_issue_description>|${{ inputs.failure_reason }}|g" \
              -e "s/<severity_level>/中/g" \
              -e "s/<impact_scope>/当前任务/g" \
              -e "s/<waiver_type>/架构审查豁免/g" \
              "$TEMPLATE" > "$WAIVER_FILE"
              
            echo "✅ WAIVER file generated: $WAIVER_FILE"
            
            # 显示生成的WAIVER文件前几行
            echo "=== WAIVER文件预览 ==="
            head -20 "$WAIVER_FILE"
            
          else
            echo "❌ Template file $TEMPLATE not found"
            # 创建基本的WAIVER文件
            cat > "$WAIVER_FILE" << EOF
# WAIVER - 紧急豁免文件
**任务ID**: ${{ inputs.task_id }}
**失败原因**: ${{ inputs.failure_reason }}
**重试次数**: ${{ inputs.retry_count }}
**生成时间**: $(date -Iseconds)
**生成智能体**: @Arbiter
**状态**: 已批准（紧急）
**有效期**: $(date -d '+30 days' +%Y-%m-%d)

## 豁免理由
Guardian质量门禁在3次重试后仍未通过，但业务需求紧急，批准继续执行。

## 技术债记录
1. 需要在30天内修复此问题
2. 需要添加监控指标
3. 需要编写回滚计划

## 批准链
- @Arbiter: 批准紧急豁免
- @Orchestrator: 已通知
- @Guardian: 已记录失败

EOF
            echo "⚠️ 使用基本模板创建WAIVER文件: $WAIVER_FILE"
          fi
          
          # 输出文件路径供后续步骤使用
          echo "WAIVER_FILE=$WAIVER_FILE" >> $GITHUB_ENV
          
      - name: Create technical debt ticket
        run: |
          echo "📝 Creating technical debt ticket for task: ${{ inputs.task_id }}"
          
          # 在实际系统中，这里会创建Jira/GitHub Issue
          # 模拟创建技术债记录
          TD_FILE="technical-debts/TD-$(date +%Y%m%d)-${{ inputs.task_id }}.md"
          mkdir -p technical-debts
          
          cat > "$TD_FILE" << EOF
# 技术债记录
**关联任务**: ${{ inputs.task_id }}
**创建时间**: $(date -Iseconds)
**创建原因**: Guardian质量门禁失败后豁免
**严重性**: 中等
**预计修复时间**: 30天内

## 问题描述
${{ inputs.failure_reason }}

## 影响范围
- 代码质量
- 可维护性
- 潜在的安全风险

## 修复方案
1. 重构相关代码
2. 添加单元测试
3. 完善错误处理

## 优先级
- [ ] 立即修复 (24小时内)
- [ ] 短期修复 (1周内)
- [x] 中期修复 (30天内)
- [ ] 长期优化 (90天内)

## 负责人
- 主要: @Coder-BE 或 @Coder-FE
- 审查: @Guardian
- 跟踪: @Orchestrator

## 验收标准
- [ ] 通过所有Guardian检查
- [ ] 单元测试覆盖率 >85%
- [ ] 代码审查通过
EOF
          
          echo "✅ Technical debt record created: $TD_FILE"
          
      - name: Update orchestrator state
        run: |
          echo "🔄 Updating orchestrator state for task: ${{ inputs.task_id }}"
          
          # 在实际系统中，这里会更新Task.DAG.json状态
          # 创建状态更新文件
          STATE_FILE=".state/arbiter-${{ inputs.task_id }}.json"
          mkdir -p .state
          
          cat > "$STATE_FILE" << EOF
{
  "task_id": "${{ inputs.task_id }}",
  "status": "waiver_granted",
  "waiver_file": "$WAIVER_FILE",
  "waiver_granted_at": "$(date -Iseconds)",
  "technical_debt_created": true,
  "next_action": "continue_execution"
}
EOF
          
          echo "✅ Orchestrator state updated: $STATE_FILE"
          
      - name: Notify related agents
        run: |
          echo "📢 Notifying related agents about waiver"
          
          # 在实际系统中，这里会发送通知
          echo "Notification summary:"
          echo "- @Orchestrator: 任务 ${{ inputs.task_id }} 已获得豁免，可以继续执行"
          echo "- @Guardian: 豁免记录已创建，请跟踪技术债修复"
          echo "- @Coder-BE/@Coder-FE: 相关技术债需要在30天内修复"
          echo "- @Tester: 请注意豁免可能影响测试覆盖率"
          
      - name: Upload waiver and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arbiter-waiver-${{ inputs.task_id }}
          path: |
            waivers/
            technical-debts/
            .state/arbiter-*.json
          retention-days: 90
          
      # Rule 6: Observability metric export (global-cicd-practices-enforcement)
      - name: Export arbiter metrics
        if: always()
        run: |
          DURATION=$(( $(date +%s) - ${{ job.started_at }} / 1000 )) || 0
          echo "{\"agent\":\"@Arbiter\",\"task_id\":\"${{ inputs.task_id }}\",\"action\":\"generate_waiver\",\"duration\":$DURATION,\"status\":\"${{ job.status }}\",\"timestamp\":\"$(date -Iseconds)\"}" > arbiter-metrics.json
          
      - name: Complete waiver process
        run: |
          echo "✅ @Arbiter waiver process completed for task: ${{ inputs.task_id }}"
          echo "📄 WAIVER file: $WAIVER_FILE"
          echo "⚖️ Technical debt created"
          echo "🔄 Orchestrator notified"
          echo "📢 Agents alerted"
          
          # 在实际系统中，这里会返回控制权给Orchestrator
          echo "Returning control to @Orchestrator for task continuation..."