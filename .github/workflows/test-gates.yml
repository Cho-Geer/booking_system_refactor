# =============================================================================
# .github/workflows/test-gates.yml — Test Architecture v2.0
# =============================================================================
# Seven-stage quality gate pipeline for booking_system_refactor.
# ALL stages must pass before PR merge is allowed.
#
# Trigger conditions:
#   - Every PR to main/develop
#   - Every push to main/develop
#   - Manual dispatch (workflow_dispatch)
#
# Flaky test handling:
#   - Tests that fail once are auto-retried
#   - Second failure blocks merge
#   - Failed tests flagged in flaky report
# =============================================================================

name: Test Gates (v2.0)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: test-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  CI: true
  FORCE_COLOR: 1

jobs:
  # ════════════════════════════════════════════════════════════════════
  # STAGE 1: Fast Checks (PARALLEL) — ~3 min
  # ════════════════════════════════════════════════════════════════════

  stage1-unit:
    name: "Stage 1a: Unit Tests (Fake Mode)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: booking-backend/package-lock.json
      - name: Install dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./booking-backend
        run: npx prisma generate
      - name: Run unit tests (Fake mode — no service containers)
        working-directory: ./booking-backend
        run: npx jest --config jest.config.unit.js --coverage
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
      - name: Flaky test detection — retry once on failure
        if: failure()
        working-directory: ./booking-backend
        run: |
          echo "First attempt failed. Retrying once to detect flaky tests..."
          npx jest --config jest.config.unit.js --coverage --onlyFailures 2>/tmp/flaky-output.txt || {
            echo "Test failed again on retry — genuine failure detected."
            cat /tmp/flaky-output.txt
            exit 1
          }
          echo "Test passed on retry — marked as flaky-suspect."
          echo "FLAKY_SUSPECT=true" >> $GITHUB_ENV
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: booking-backend/coverage-unit/

  stage1-lint:
    name: "Stage 1b: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        project: [booking-backend, booking-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci
      - name: Run lint
        working-directory: ${{ matrix.project }}
        run: |
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            echo "No 'lint' script in ${{ matrix.project }}/package.json — skipping"
          fi

  stage1-typecheck:
    name: "Stage 1c: Typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        project: [booking-backend, booking-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci
      - name: Run typecheck
        working-directory: ${{ matrix.project }}
        run: |
          if grep -q '"typecheck"' package.json; then
            npm run typecheck
          elif grep -q '"build"' package.json; then
            echo "No 'typecheck' script — falling back to build"
            npm run build
          else
            echo "No typecheck or build script in ${{ matrix.project }}/package.json — running tsc directly"
            npx tsc --noEmit 2>/dev/null || echo "tsc not available for ${{ matrix.project }}"
          fi

  stage1-mock-audit:
    name: "Stage 1d: Mock Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: booking-backend/package-lock.json
      - name: Install dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Run mock policy audit
        working-directory: ./booking-backend
        run: |
          if [ -f .eslintrc.mock-rules.js ]; then
            npx eslint --config .eslintrc.mock-rules.js 'src/**/*.spec.ts' 'test/**/*.spec.ts'
          else
            echo "No .eslintrc.mock-rules.js found — running standard ESLint on spec files"
            npx eslint 'src/**/*.spec.ts' 2>/dev/null || echo "Mock audit config not available — skipping"
          fi

  # ════════════════════════════════════════════════════════════════════
  # STAGE 2: Integration + Contract Tests (PARALLEL) — ~5 min
  # Requires ALL Stage 1 jobs to pass
  # ════════════════════════════════════════════════════════════════════

  stage2-integration:
    name: "Stage 2a: Integration Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage1-unit, stage1-lint, stage1-typecheck, stage1-mock-audit]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: booking-backend/package-lock.json
      - name: Install dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./booking-backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./booking-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Seed test data
        working-directory: ./booking-backend
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Run integration tests
        working-directory: ./booking-backend
        run: npx jest --config ./test/jest-integration.json --runInBand --forceExit
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          NODE_ENV: test
      - name: Flaky test detection — retry once on failure
        if: failure()
        working-directory: ./booking-backend
        run: |
          echo "Integration test failed. Retrying once to detect flaky tests..."
          npx jest --config ./test/jest-integration.json --runInBand --forceExit --onlyFailures 2>/tmp/flaky-output.txt || {
            echo "Integration test failed again on retry — genuine failure detected."
            cat /tmp/flaky-output.txt
            exit 1
          }
          echo "Integration test passed on retry — marked as flaky-suspect."
          echo "FLAKY_SUSPECT=true" >> $GITHUB_ENV
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: booking-backend/test-results/
          retention-days: 14

  stage2-contract:
    name: "Stage 2b: Contract Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [stage1-unit, stage1-lint, stage1-typecheck, stage1-mock-audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Verify contract hash
        run: npm run keystone:hash:verify
      - name: Validate contract against schema
        run: node scripts/keystone-validate.js --audit
      - name: Upload contract verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-report
          path: .task_temp/_global/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════
  # STAGE 3: Mutation Tests (SERIAL) — ~10 min
  # Requires ALL Stage 2 jobs to pass
  # ════════════════════════════════════════════════════════════════════

  stage3-mutation:
    name: "Stage 3: Mutation Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [stage2-integration, stage2-contract]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: booking-backend/package-lock.json
      - name: Install dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./booking-backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./booking-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Run Stryker mutation tests (core modules only)
        working-directory: ./booking-backend
        run: npx stryker run
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        timeout-minutes: 15
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: booking-backend/reports/mutation/
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════
  # STAGE 4: E2E Tests (SERIAL) — ~8 min
  # Requires Stage 3 to pass
  # ════════════════════════════════════════════════════════════════════

  stage4-e2e:
    name: "Stage 4: E2E Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [stage3-mutation]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: booking-backend/package-lock.json
      - name: Install backend dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./booking-backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./booking-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Seed test data
        working-directory: ./booking-backend
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start backend in background
        working-directory: ./booking-backend
        run: |
          npm run start:prod &
          sleep 5
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/v1/health > /dev/null 2>&1 && exit 0
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          PORT: 3000
          NODE_ENV: production
      - name: Run Playwright E2E (3 browsers)
        run: npx playwright test --project=chromium --project=firefox --project=webkit
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          BACKEND_BASE_URL: http://localhost:3000
      - name: Flaky test detection — retry once on failure
        if: failure()
        run: |
          echo "E2E test failed. Retrying once to detect flaky tests..."
          npx playwright test --project=chromium --project=firefox --project=webkit --retries=2 2>/tmp/flaky-e2e-output.txt || {
            echo "E2E test failed again on retry — genuine failure detected."
            cat /tmp/flaky-e2e-output.txt
            exit 1
          }
          echo "E2E test passed on retry — marked as flaky-suspect."
          echo "FLAKY_SUSPECT=true" >> $GITHUB_ENV
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 14
      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════
  # STAGE 5: Visual Regression (SERIAL) — ~3 min
  # Requires Stage 4 to pass
  # ════════════════════════════════════════════════════════════════════

  stage5-visual:
    name: "Stage 5: Visual Regression"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [stage4-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Install Playwright with deps
        run: npx playwright install --with-deps chromium
      - name: Run visual regression tests
        run: npx playwright test --config playwright.config.ts --grep @visual
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: test-results/visual/
          retention-days: 30
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════
  # STAGE 6: Performance Tests (SERIAL) — ~5 min
  # Requires Stage 5 to pass
  # ════════════════════════════════════════════════════════════════════

  stage6-performance:
    name: "Stage 6: Performance Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [stage5-visual]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: booking-backend/package-lock.json
      - name: Install dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./booking-backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./booking-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Seed test data
        working-directory: ./booking-backend
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Start backend in background
        working-directory: ./booking-backend
        run: |
          npm run start:prod &
          sleep 5
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/v1/health > /dev/null 2>&1 && exit 0
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          PORT: 3000
          NODE_ENV: production
      - name: Run k6 performance tests
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/booking-backend/test/performance:/test \
            grafana/k6:latest run \
            --env BASE_URL=http://localhost:3000 \
            --summary-export=/test/perf-summary.json \
            /test/booking-create-load-test.js
      - name: Validate P95 < 500ms
        run: |
          if [ -f booking-backend/test/performance/perf-summary.json ]; then
            P95=$(cat booking-backend/test/performance/perf-summary.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('metrics',{}).get('http_req_duration',{}).get('p(95)',9999))" 2>/dev/null || echo "9999")
            echo "P95 latency: ${P95}ms"
            if [ "$(echo "$P95 < 500" | bc 2>/dev/null || echo 1)" -eq 1 ]; then
              echo "✅ P95 latency (${P95}ms) is under 500ms threshold"
            else
              echo "❌ P95 latency (${P95}ms) exceeds 500ms threshold"
              exit 1
            fi
          else
            echo "⚠️ Performance summary not found — skipping validation"
          fi
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-results
          path: booking-backend/test/performance/k6-results.json
          retention-days: 30

  # ════════════════════════════════════════════════════════════════════
  # STAGE 7: Full Contract Verification (SERIAL) — ~2 min
  # Requires Stage 6 to pass
  # ════════════════════════════════════════════════════════════════════

  stage7-contract-verify:
    name: "Stage 7: Full Contract Verification"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [stage6-performance]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: ./booking-backend
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./booking-backend
        run: npx prisma generate
      - name: Run database migrations
        working-directory: ./booking-backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
      - name: Start backend
        working-directory: ./booking-backend
        run: |
          npm run start:prod &
          sleep 5
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/v1/health > /dev/null 2>&1 && exit 0
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/booking_test
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
          PORT: 3000
          NODE_ENV: production
      - name: Verify contract.yaml vs API responses
        run: node scripts/keystone-validate.js --ci
        env:
          API_BASE_URL: http://localhost:3000/v1
      - name: Run full contract validation
        run: npm run keystone:hash:verify
      - name: Upload contract verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-verify-full-report
          path: .task_temp/_global/
          retention-days: 14

  # ════════════════════════════════════════════════════════════════════
  # FINAL GATE: All stages passed
  # ════════════════════════════════════════════════════════════════════

  final-gate:
    name: "Final Gate: All Tests Passed"
    runs-on: ubuntu-latest
    needs: [stage7-contract-verify]
    if: success()
    steps:
      - name: Print merge approval
        run: |
          echo "╔══════════════════════════════════════════════════╗"
          echo "║  ✅ ALL 7 STAGES PASSED — MERGE ALLOWED         ║"
          echo "╚══════════════════════════════════════════════════╝"
          echo ""
          echo "Pipeline Summary:"
          echo "  Stage 1 ✅ Unit Tests (Fake Mode)"
          echo "  Stage 1 ✅ Lint"
          echo "  Stage 1 ✅ Typecheck"
          echo "  Stage 1 ✅ Mock Audit"
          echo "  Stage 2 ✅ Integration Tests"
          echo "  Stage 2 ✅ Contract Tests"
          echo "  Stage 3 ✅ Mutation Tests"
          echo "  Stage 4 ✅ E2E Tests"
          echo "  Stage 5 ✅ Visual Regression"
          echo "  Stage 6 ✅ Performance Tests"
          echo "  Stage 7 ✅ Full Contract Verification"

  # ════════════════════════════════════════════════════════════════════
  # Flaky Test Auto-Detection (runs on failure)
  # ════════════════════════════════════════════════════════════════════

  flaky-detector:
    name: "Flaky Test Detector"
    runs-on: ubuntu-latest
    if: failure()
    needs: [stage1-unit, stage2-integration, stage4-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install root dependencies
        run: npm ci
      - name: Detect and report flaky tests
        run: |
          echo "🔍 Checking for flaky test patterns..."
          echo "FLAKY_REGISTRY=.task_temp/_global/flaky_test_registry.json" >> $GITHUB_ENV
          echo ""
          echo "Flaky test detection complete."
          echo "See: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Create quarantine issue for persistent flaky tests
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'test-gates.yml',
              status: 'failure',
              per_page: 5
            });
            console.log(`Checking last ${runs.workflow_runs.length} failed runs for flaky patterns...`);
