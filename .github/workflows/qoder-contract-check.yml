name: Qoder Contract & State Machine Check

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - '.qoder/state/machine.json'
      - '.qoder/state/machine.schema.json'
      - 'booking_system_refactor/contract.yaml'
      - 'booking_system_refactor/booking-backend/prisma/schema.prisma'
      - 'booking_system_refactor/booking-frontend/src/app/shared/dto/**'
      - 'booking_system_refactor/booking-frontend/src/environments/environment.ts'
      - 'Task.DAG.json'
  pull_request:
    branches: [main]
    paths:
      - '.qoder/state/machine.json'
      - '.qoder/state/machine.schema.json'
      - 'booking_system_refactor/contract.yaml'
      - 'booking_system_refactor/booking-backend/prisma/schema.prisma'
      - 'booking_system_refactor/booking-frontend/src/app/shared/dto/**'
      - 'booking_system_refactor/booking-frontend/src/environments/environment.ts'
      - 'Task.DAG.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-hash-check:
    name: Contract Hash Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: booking_system_refactor/package-lock.json

      - name: Install dependencies
        working-directory: ./booking_system_refactor
        run: npm ci

      - name: Verify Contract Hashes
        working-directory: ./booking_system_refactor
        run: |
          echo "🔍 [Qoder CI] Verifying contract hashes..."
          node scripts/update-machine-hash.js verify

      - name: Qoder State Machine Verify (qoder:verify)
        working-directory: ./booking_system_refactor
        run: |
          echo "🔍 [Qoder CI] Running qoder:verify - Full state machine validation..."
          npm run qoder:hash:verify

      - name: Validate Evidence Files for Task Transitions
        if: github.event_name == 'pull_request'
        working-directory: ./booking_system_refactor
        run: |
          echo "🔍 [Qoder CI] Validating task lifecycle evidence files..."
          node scripts/qoder-verify-evidence.js || {
            echo "❌ [Qoder CI] Task lifecycle evidence validation failed"
            echo ""
            echo "Required evidence files missing or invalid:"
            echo "  - tasks/{taskId}/TASK_LOG.md (for InProgress → Testing)"
            echo "  - tasks/{taskId}/test_report.json (for Testing → Review)"
            echo "  - tasks/{taskId}/guardian_report.md (for Review → Done)"
            exit 1
          }

      - name: Report Status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ [Qoder CI] All Qoder validations passed"
          else
            echo "❌ [Qoder CI] Qoder validation failed"
            echo ""
            echo "Possible causes:"
            echo "  1. Contract file was modified but machine.json was not updated"
            echo "  2. Manual edit to machine.json without recalculating hash"
            echo "  3. Task state transition without required evidence files"
            echo "  4. Evidence files do not match schema requirements"
            echo ""
            echo "To fix:"
            echo "  1. Run: npm run qoder:hash"
            echo "  2. Ensure all task transitions have required evidence files"
            echo "  3. Commit the updated files"
            exit 1
          fi
