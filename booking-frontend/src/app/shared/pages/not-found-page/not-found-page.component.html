<div class="flex min-h-screen flex-col items-center justify-center bg-gray-50 px-4">
  <div class="text-center">
    <h1 class="text-8xl font-bold text-primary-600">404</h1>

    <h2 class="mt-4 text-2xl font-semibold text-gray-800">Page Not Found</h2>

    <p class="mt-2 text-gray-500">
      The page you're looking for doesn't exist.
    </p>

    <button
      type="button"
      class="mt-8 inline-flex items-center justify-center rounded-md bg-primary-600 px-6 py-3 text-base font-medium text-white shadow-sm transition-colors hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2"
      (click)="goHome()"
    >
      Back to Home
    </button>
  </div>
</div>
