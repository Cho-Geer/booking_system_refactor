<p-dialog
  [visible]="visible() ?? false"
  [header]="header()"
  [closable]="closable() ?? false"
  [dismissableMask]="dismissableMask() ?? false"
  [draggable]="draggable() ?? false"
  [resizable]="resizable() ?? false"
  [modal]="modal() ?? false"
  [position]="position()"
  [styleClass]="combinedStyleClass"
  [appendTo]="appendTo()"
  (visibleChange)="visibleChange.emit($event)"
>
  <!-- Header slot -->
  <ng-content select="[app-modal-header]" />
  <ng-content select="[appModalHeader]" />
  
  <!-- Body slot -->
  <div class="app-modal-body">
    <ng-content />
  </div>
  
  <!-- Footer slot -->
  <div class="app-modal-footer">
    <ng-content select="[app-modal-footer]" />
    <ng-content select="[appModalFooter]" />
  </div>
</p-dialog>
