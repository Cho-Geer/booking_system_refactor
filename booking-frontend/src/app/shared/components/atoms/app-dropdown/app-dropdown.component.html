<p-select
  [options]="options()"
  [optionLabel]="optionLabel()"
  [optionValue]="optionValue()"
  [placeholder]="placeholder()"
  [disabled]="disabled() || false"
  [class.ng-invalid]="invalid()"
  [variant]="variant()"
  [filter]="filter()"
  [styleClass]="styleClass()"
  [ngModel]="value()"
  appendTo="body"
  (onChange)="onModelChange($event.value)"
/>
