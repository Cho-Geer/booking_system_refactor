<p-card
  [header]="headerIcon() ? undefined : header()"
  [subheader]="subheader()"
  [styleClass]="combinedStyleClass"
>
  @if (headerIcon()) {
    <div class="flex items-center gap-2 mb-3">
      <i class="app-card-header-icon pi {{ headerIcon() }} text-accent-blue"></i>
      @if (header()) {
        <span class="font-semibold">{{ header() }}</span>
      }
    </div>
  }
  <ng-content />
</p-card>
