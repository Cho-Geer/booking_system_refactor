<p-button
  [label]="iconOnly() ? undefined : label()"
  [severity]="severity()"
  [disabled]="isDisabled()"
  [loading]="loading()"
  [icon]="resolvedIcon()"
  [iconPos]="iconPos()"
  [type]="type()"
  [size]="primeSize()"
  [raised]="raised()"
  [rounded]="rounded() || iconOnly()"
  [text]="text() || variant() === 'ghost'"
  [outlined]="outlined() || variant() === 'secondary'"
  [link]="link()"
  [plain]="plain()"
  [styleClass]="combinedStyleClass"
  (onClick)="onClick.emit($event)"
/>
