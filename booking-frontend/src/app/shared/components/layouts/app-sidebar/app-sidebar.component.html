<!-- Desktop sidebar -->
<aside class="hidden lg:flex flex-col fixed left-0 top-16 bottom-0 w-60 bg-white/75 backdrop-blur-xl border-r border-white/30 z-40 transition-transform duration-300">
  <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
    @for (item of items(); track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="bg-primary-start/10 text-primary-start border-l-[3px] border-primary-start"
         [routerLinkActiveOptions]="{exact: item.route === '/'}"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-text-secondary hover:bg-black/5 hover:text-text-primary transition-all duration-200 border-l-[3px] border-transparent">
        <span class="w-5 h-5 flex items-center justify-center text-lg">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
        @if (item.badge && item.badge > 0) {
          <span class="ml-auto px-2 py-0.5 rounded-full text-xs font-medium bg-primary-start/15 text-primary-start">{{ item.badge }}</span>
        }
      </a>
    }
  </nav>
</aside>

<!-- Mobile overlay -->
@if (isOpen()) {
  <div class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 lg:hidden" (click)="onClose()"></div>
}

<!-- Mobile drawer -->
<div class="fixed top-0 left-0 bottom-0 w-64 bg-white/85 backdrop-blur-xl border-r border-white/30 z-50 transition-transform duration-300 lg:hidden"
     [ngClass]="{'translate-x-0': isOpen(), '-translate-x-full': !isOpen()}">
  <div class="flex items-center justify-between h-16 px-4 border-b border-white/30">
    <span class="text-lg font-bold bg-gradient-to-r from-primary-start to-primary-end bg-clip-text text-transparent">Menu</span>
    <button (click)="onClose()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-black/5 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <nav class="py-4 px-3 space-y-1">
    @for (item of items(); track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="bg-primary-start/10 text-primary-start"
         (click)="onClose()"
         class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-text-secondary hover:bg-black/5 transition-colors">
        <span>{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
