<div data-testid="layout-container" class="layout-container">
  <div data-testid="layout-wrapper"
       class="layout-wrapper transition-colors duration-300 min-h-screen"
       [class.gradient-page-bg]="!isAdminRoute()">
    <app-header [navLinks]="navLinks()"
                [userName]="userName()"
                [userRole]="userRole()"
                [isAdmin]="isAdmin()"
                [menuItems]="menuItems()"
                [showSearch]="showSearchInHeader()"
                [notificationCount]="notificationCount()"
                 [messageCount]="messageCount()"
                 [messages]="messages()"
                (menuToggle)="onMenuToggle()"
                (logout)="onLogout()" />

    <div class="layout-content">
    <app-sidebar [items]="sidebarItems()"
                 [sections]="sidebarSections()"
                 [navLinks]="navLinks()"
                 [isOpen]="sidebarOpen"
                 [userName]="userName()"
                 [userRole]="userRole()"
                 [solid]="sidebarSolid()"
                 (close)="sidebarOpen = false"
                 (logout)="onLogout()" />

      <!-- Main content area -->
      <main class="main-content transition-all duration-300 z-[1] relative w-full pt-16 lg:pl-60 min-h-screen"
            [class.bg-grid]="isAdminRoute()">
        <div class="max-w-7xl mx-auto w-full p-4 lg:p-6 animate-page-enter">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
</div>
