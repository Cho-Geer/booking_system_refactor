<div data-testid="layout-container" class="layout-container">
  <div data-testid="layout-wrapper" class="layout-wrapper">
    <app-header [navLinks]="navLinks()"
                [userName]="userName()"
                [userRole]="userRole()"
                [isAdmin]="isAdmin()"
                [menuItems]="menuItems()"
                (menuToggle)="onMenuToggle()"
                (logout)="onLogout()"
                (actionClick)="onHeaderAction($event)" />

    <div class="layout-content">
      <app-sidebar [items]="sidebarItems()"
                   [sections]="sidebarSections()"
                   [navLinks]="navLinks()"
                   [isOpen]="sidebarOpen"
                   [userName]="userName()"
                   [userRole]="userRole()"
                   (close)="sidebarOpen = false" />

      <main class="main-content">
        <div class="content-wrapper">
          <router-outlet />
        </div>
      </main>
    </div>
  </div>
</div>
