<div data-testid="layout-wrapper" class="min-h-screen transition-colors duration-300"
     [ngClass]="isAdminRoute() ? 'bg-[#F2F3F5]' : 'gradient-page-bg'">
  <app-header [navLinks]="navLinks()"
              [userName]="userName()"
              [userRole]="userRole()"
              [isAdmin]="isAdmin()"
              [menuItems]="menuItems()"
              (menuToggle)="onMenuToggle()"
              (logout)="onLogout()" />

  <app-sidebar [items]="sidebarItems()"
               [sections]="sidebarSections()"
               [isOpen]="sidebarOpen"
               [isAdmin]="isAdmin()"
               [solid]="isAdminRoute()"
               [userName]="userName()"
               [userRole]="userRole()"
               (close)="sidebarOpen = false" />

  <!-- Breadcrumb placeholder -->
  <div data-testid="breadcrumb-container" class="pt-16 lg:pl-60">
    <div class="max-w-7xl mx-auto px-4 lg:px-6 py-2">
      <!-- Breadcrumb content will be injected here in future phases -->
    </div>
  </div>

  <main class="pt-4 lg:pl-60 min-h-screen transition-all duration-300 z-[1] relative">
    <div class="max-w-7xl mx-auto p-4 lg:p-6 animate-page-enter">
      <router-outlet />
    </div>
  </main>
</div>
