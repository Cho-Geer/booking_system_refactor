<div class="min-h-screen gradient-page-bg">
  <app-header [navLinks]="navLinks()"
              [userName]="userName()"
              [userRole]="userRole()"
              [isAdmin]="isAdmin()"
              [menuItems]="menuItems()"
              (menuToggle)="onMenuToggle()"
              (logout)="onLogout()" />
  <app-sidebar [items]="sidebarItems()"
               [isOpen]="sidebarOpen"
               [isAdmin]="isAdmin()"
               (close)="sidebarOpen = false" />
  <main class="pt-16 lg:pl-60 min-h-screen transition-all duration-300">
    <div class="max-w-7xl mx-auto p-4 lg:p-6 animate-page-enter">
      <router-outlet />
    </div>
  </main>
</div>
