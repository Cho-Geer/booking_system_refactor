<header class="sticky top-0 z-50 transition-all duration-300 bg-white border-b border-gray-200" [class.shadow-md]="scrollY() > 10">
  <div class="flex items-center justify-between h-16">
    <!-- Left: Hamburger + Logo -->
    <div class="flex items-center gap-4">
      <button (click)="toggleSidebar()" class="lg:hidden w-10 h-10 flex items-center justify-center rounded-xl hover:bg-black/5 transition-colors" aria-label="Toggle menu">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <a routerLink="/" class="text-xl font-bold bg-gradient-to-r from-primary-start to-primary-end bg-clip-text text-transparent">
        Booking
      </a>
    </div>

    <!-- Center: Navigation links - moved from sidebar -->
    <nav class="hidden md:flex items-center gap-1">
      @for (link of navLinks(); track link.route) {
        <a [routerLink]="link.route"
           routerLinkActive="text-primary-start bg-primary-start/5"
           class="px-4 py-2 rounded-xl text-sm font-medium text-text-secondary hover:text-primary-start hover:bg-primary-start/5 transition-all duration-200">
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- Right: Theme Toggle + Notification + User -->
    <div class="flex items-center gap-3">
      <!-- Admin Quick Actions -->
      @if (isAdmin()) {
        <div class="hidden lg:flex items-center gap-2 mr-2">
          <app-button label="New Booking" variant="primary" size="sm" icon="pi pi-plus" (onClick)="onActionClick('new-booking')" />
          <app-button label="Add Service" variant="secondary" size="sm" icon="pi pi-plus-circle" (onClick)="onActionClick('add-service')" />
        </div>
      }

      <!-- Theme Toggle -->
      <app-theme-toggle />

      <!-- Notification Bell -->
      <button class="relative w-10 h-10 flex items-center justify-center rounded-xl hover:bg-black/5 transition-colors" aria-label="Notifications">
        <i class="pi pi-bell text-text-secondary text-lg"></i>
        @if (notificationCount() && notificationCount()! > 0) {
          <span data-testid="notification-badge" class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] flex items-center justify-center px-1 rounded-full text-[10px] font-bold bg-danger text-white">
            {{ notificationCount() }}
          </span>
        }
      </button>

      @if (userName()) {
        <div class="relative flex items-center gap-2">
          <!-- Admin Badge -->
          @if (isAdmin()) {
            <span data-testid="admin-badge" class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-primary-start/10 text-primary-start border border-primary-start/20">
              Admin
            </span>
          }
          <button (click)="menu.toggle($event)" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-black/5 transition-colors">
            <p-avatar [label]="userName()!.charAt(0).toUpperCase()" styleClass="bg-gradient-to-r from-primary-start to-primary-end text-white text-sm" shape="circle" size="normal" />
            <span class="user-name hidden sm:block text-sm font-medium text-text-primary">{{ userName() }}</span>
          </button>
          <p-menu #menu [model]="menuItems()" [popup]="true" />
        </div>
      } @else {
        <a routerLink="/auth/login" class="px-4 py-2 rounded-xl bg-gradient-to-r from-primary-start to-primary-end text-white text-sm font-medium hover:opacity-90 transition-opacity shadow-glass">
          登录
        </a>
      }
    </div>
  </div>
</header>
