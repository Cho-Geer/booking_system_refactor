<header class="sticky top-0 z-50 transition-all duration-300 bg-card-bg border-b border-border-color" [class.shadow-md]="scrollY() > 10">
  <div class="flex items-center justify-between h-16 px-4 sm:px-6">
    <!-- Left: Hamburger + Logo -->
    <div class="flex items-center gap-3">
      <button (click)="toggleSidebar()" class="lg:hidden w-10 h-10 flex items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors" aria-label="Toggle menu">
        <i class="pi pi-bars text-text-secondary"></i>
      </button>
      <a routerLink="/" class="text-lg font-bold gradient-text">BookSys</a>
    </div>

    <!-- Center: Search Bar (desktop) -->
    <div class="hidden md:block">
      <div class="relative">
        <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary text-sm"></i>
        <input type="text" placeholder="Search bookings, customers..." class="w-64 pl-10 pr-4 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-blue focus:ring-1 focus:ring-accent-blue/30 placeholder:text-text-disabled transition-colors">
      </div>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-2 sm:gap-3">
      <!-- Admin Quick Actions -->
      @if (isAdmin()) {
        <div class="hidden lg:flex items-center gap-2 mr-2">
          <app-button label="New Booking" variant="primary" size="sm" icon="pi pi-plus" (onClick)="onActionClick('new-booking')" />
          <app-button label="Add Service" variant="secondary" size="sm" icon="pi pi-plus-circle" (onClick)="onActionClick('add-service')" />
        </div>
      }

      <!-- Notifications -->
      <button class="relative w-10 h-10 flex items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors" aria-label="Notifications">
        <i class="pi pi-bell text-text-secondary text-lg"></i>
        @if (notificationCount() && notificationCount()! > 0) {
          <span data-testid="notification-badge" class="absolute top-1.5 right-1.5 min-w-[18px] h-[18px] flex items-center justify-center px-1 rounded-full text-[10px] font-bold bg-accent-red text-white">
            {{ notificationCount() }}
          </span>
        }
      </button>

      <!-- Messages -->
      <button class="relative hidden sm:flex w-10 h-10 items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors" aria-label="Messages">
        <i class="pi pi-envelope text-text-secondary text-lg"></i>
      </button>

      <!-- Settings -->
      <button class="hidden sm:flex w-10 h-10 items-center justify-center rounded-lg hover:bg-card-bg-light transition-colors" aria-label="Settings">
        <i class="pi pi-cog text-text-secondary text-lg"></i>
      </button>

      <!-- Theme Toggle -->
      <app-theme-toggle />

      <!-- User -->
      @if (userName()) {
        <div class="relative flex items-center gap-2">
          @if (isAdmin()) {
            <span data-testid="admin-badge" class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-accent-blue/10 text-accent-blue border border-accent-blue/20">
              Admin
            </span>
          }
          <button (click)="menu.toggle($event)" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-card-bg-light transition-colors">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-accent-blue to-accent-blue-dark flex items-center justify-center text-white text-sm font-bold">
              {{ userName()!.charAt(0).toUpperCase() }}
            </div>
            <span class="hidden sm:block text-sm font-medium text-text-primary">{{ userName() }}</span>
          </button>
          <p-menu #menu [model]="menuItems()" [popup]="true" />
        </div>
      } @else {
        <a routerLink="/auth/login" class="px-4 py-2 rounded-lg bg-accent-blue hover:bg-accent-blue-dark text-white text-sm font-medium transition-colors">
          Sign In
        </a>
      }
    </div>
  </div>
</header>
