<div class="space-y-6">
  <div class="flex items-start justify-between gap-4">
    <div class="flex-1">
      <app-welcome-card [today]="today" />
    </div>
    <div class="flex-shrink-0 mt-2">
      <app-notification-bell />
    </div>
  </div>

  @if (vm().isLoading) {
    <div class="flex justify-center py-12">
      <div class="loading-spinner"></div>
    </div>
  }

  @if (!vm().isLoading && vm().stats) {
    <app-stats-cards-row [cards]="statsCards()" />

    <app-charts-section
      [bookingTrendData]="bookingTrendChartData()"
      [bookingTrendOptions]="bookingTrendChartOptions"
      [doughnutData]="servicePopularityChartData()"
      [barData]="timeDistributionChartData()"
      [doughnutOptions]="doughnutOptions"
      [barOptions]="barOptions"
      [timeRange]="timeRange()"
      (timeRangeChange)="onTimeRangeChange($event)"
      (periodChange)="onPeriodChange($event)"
    />

    <div class="grid grid-cols-1 gap-5">
      <app-recent-bookings-panel [rows]="bookingRows()" (rowClick)="navigateTo('/admin/appointments')" />
      <app-recent-users-panel [rows]="recentUsersRows()" (rowClick)="navigateTo('/admin/users')" />
      <app-recent-services-panel [rows]="recentServicesRows()" (rowClick)="navigateTo('/admin/services')" />
    </div>

    <div class="grid grid-cols-1 gap-5">
      <app-system-status-panel
        [statusItems]="systemStatus()"
        [metrics]="systemMetrics()"
        (expandChange)="onExpandSystemStatus()"
      />
    </div>
  }

  @if (vm().error) {
    <div class="sharp-card p-5 bg-card-bg border-l-4 border-accent-red">
      <p class="text-sm text-accent-red">{{ vm().error }}</p>
    </div>
  }
</div>
