<div class="sharp-card card-lift p-5 bg-card-bg h-full">
  <div class="flex items-center justify-between mb-5">
    <h3 class="text-base font-bold text-text-primary">Booking Distribution</h3>
    <div class="flex gap-2 no-click-feedback relative">
      <app-button label="Services" variant="primary" size="sm" />
      <div class="relative">
        <app-button
          [label]="displayTimeRangeLabel()"
          variant="secondary"
          size="sm"
          (onClick)="toggleTimeDropdown($event)"
        />
        @if (timeDropdownOpen()) {
          <div
            class="absolute right-0 top-full mt-2 w-48 bg-card-bg border border-border-color rounded-lg shadow-xl z-50 overflow-hidden"
            [class.opacity-0]="!dropdownAnimating()"
            [class.opacity-100]="dropdownAnimating()"
            [class.scale-95]="!dropdownAnimating()"
            [class.scale-100]="dropdownAnimating()"
            [class.transition-all]="true"
            [class.duration-200]="true"
            [class.ease-out]="true"
          >
            @for (option of timeRangeOptions; track option.value) {
              <button
                class="w-full text-left px-3 py-2.5 text-sm font-medium transition-all duration-200 flex items-center border-l-2 border-transparent"
                [class.text-accent-green]="selectedTimeRange() === option.value"
                [class.bg-accent-green/10]="selectedTimeRange() === option.value"
                [class.border-l-accent-green]="selectedTimeRange() === option.value"
                [class.shadow-sm]="selectedTimeRange() === option.value"
                [class.hover:bg-accent-green/20]="selectedTimeRange() === option.value"
                [class.text-text-secondary]="selectedTimeRange() !== option.value"
                [class.hover:bg-card-bg-light]="selectedTimeRange() !== option.value"
                [class.hover:text-text-primary]="selectedTimeRange() !== option.value"
                (click)="selectTimeRange(option.value)"
              >
                <span class="truncate">{{ option.label }}</span>
              </button>
            }
          </div>
        }
        @if (customRangeOpen()) {
          <div
            class="absolute right-0 top-full mt-2 w-72 bg-card-bg border border-border-color rounded-lg shadow-xl z-50 p-4"
            [class.opacity-0]="!customPanelAnimating()"
            [class.opacity-100]="customPanelAnimating()"
            [class.scale-95]="!customPanelAnimating()"
            [class.scale-100]="customPanelAnimating()"
            [class.transition-all]="true"
            [class.duration-200]="true"
            [class.ease-out]="true"
          >
            <div class="flex items-center justify-between mb-4">
              <h4 class="text-sm font-semibold text-text-primary">Select Date Range</h4>
              <button
                class="text-text-secondary hover:text-text-primary transition-colors"
                (click)="closeCustomPanel()"
              >
                <i class="pi pi-times"></i>
              </button>
            </div>
            <div class="space-y-3 mb-4">
              <div>
                <label class="block text-xs text-text-secondary mb-1">From</label>
                <p-datepicker
                  [(ngModel)]="customStartDateObj"
                  dateFormat="yy-mm-dd"
                  [showIcon]="true"
                  styleClass="w-full"
                />
              </div>
              <div>
                <label class="block text-xs text-text-secondary mb-1">To</label>
                <p-datepicker
                  [(ngModel)]="customEndDateObj"
                  dateFormat="yy-mm-dd"
                  [minDate]="customStartDateObj() ?? undefined"
                  [showIcon]="true"
                  styleClass="w-full"
                />
              </div>
            </div>
            <div class="flex gap-2 justify-end">
              <app-button
                label="Cancel"
                variant="ghost"
                size="sm"
                (onClick)="closeCustomPanel()"
              />
              <app-button
                label="Apply"
                variant="primary"
                size="sm"
                [disabled]="!customStartDateObj() || !customEndDateObj()"
                (onClick)="applyCustomRange()"
              />
            </div>
          </div>
        }
      </div>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="h-56">
      <app-chart type="doughnut" [data]="doughnutData()" [options]="doughnutOptions()" height="224px"></app-chart>
    </div>
    <div class="h-56">
      <app-chart type="bar" [data]="barData()" [options]="barOptions()" height="224px"></app-chart>
    </div>
  </div>
</div>
