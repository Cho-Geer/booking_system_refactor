<div class="sharp-card p-5 card-lift bg-card-bg">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-sm font-medium text-text-secondary">{{ data().label | t }}</h3>
    <div class="w-10 h-10 rounded-lg {{ data().iconBg }} flex items-center justify-center {{ data().iconColor }}">
      <i class="{{ data().icon }}"></i>
    </div>
  </div>
  <div class="flex items-end justify-between mb-3">
    <p class="text-3xl font-bold text-text-primary">{{ data().value | number }}</p>
    <span class="change-indicator {{ data().trendUp ? 'positive' : 'negative' }}">
      <i class="pi {{ data().trendUp ? 'pi-arrow-up' : 'pi-arrow-down' }} mr-1 text-xs"></i>
      {{ data().trend }}
    </span>
  </div>
  <div class="progress-bar">
    <div class="progress-bar-fill" [style.width.%]="data().progress"></div>
  </div>
  <div class="flex justify-between mt-1.5 text-xs text-text-secondary">
    <span>{{ 'admin.stats.target' | t }}: {{ data().target | number }}</span>
    <span>{{ data().progress }}%</span>
  </div>
</div>
