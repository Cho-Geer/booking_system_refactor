<div class="sharp-card p-5 bg-card-bg">
  <h3 class="text-base font-bold text-text-primary mb-5">{{ 'admin.quickBooking.title' | t }}</h3>

  <form class="space-y-4" (ngSubmit)="onSubmit()">
    <div>
      <label class="block text-xs font-medium text-text-secondary mb-1.5">{{ 'admin.quickBooking.customer' | t }}</label>
      <select
        class="w-full px-3 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 transition-colors"
        [ngModel]="selectedUser()"
        (ngModelChange)="selectedUser.set($event)"
        name="userId"
      >
        <option [ngValue]="null">{{ 'admin.quickBooking.selectCustomer' | t }}</option>
        @for (user of users(); track user.id) {
          <option [ngValue]="user.id">{{ user.name }} ({{ user.email || user.phone }})</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-text-secondary mb-1.5">{{ 'admin.quickBooking.service' | t }}</label>
      <select
        class="w-full px-3 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 transition-colors"
        [ngModel]="selectedService()"
        (ngModelChange)="selectedService.set($event); loadSlots()"
        name="serviceId"
      >
        <option [ngValue]="null">{{ 'admin.quickBooking.selectService' | t }}</option>
        @for (svc of services(); track svc.id) {
          <option [ngValue]="svc.id">{{ svc.name }} ({{ svc.price | currency }})</option>
        }
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-text-secondary mb-1.5">{{ 'admin.quickBooking.date' | t }}</label>
      <input
        type="date"
        class="w-full px-3 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 transition-colors"
        [ngModel]="selectedDate()"
        (ngModelChange)="selectedDate.set($event); loadSlots()"
        name="appointmentDate"
      />
    </div>

    <div>
      <label class="block text-xs font-medium text-text-secondary mb-1.5">{{ 'admin.quickBooking.timeSlot' | t }}</label>
      <select
        class="w-full px-3 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 transition-colors"
        [ngModel]="selectedSlot()"
        (ngModelChange)="selectedSlot.set($event)"
        name="slotId"
      >
        <option [ngValue]="null">{{ 'admin.quickBooking.selectTimeSlot' | t }}</option>
        @for (slot of timeSlots(); track slot.id) {
          <option [ngValue]="slot.id">
            {{ slot.startTime | date:'shortTime' }} - {{ slot.endTime | date:'shortTime' }}
            @if (slot.maxOvertimeMinutes) { (+{{ slot.maxOvertimeMinutes }}min overtime) }
          </option>
        }
      </select>
    </div>

    <div>
      <label class="block text-xs font-medium text-text-secondary mb-1.5">{{ 'admin.quickBooking.notes' | t }}</label>
      <textarea
        class="w-full px-3 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 transition-colors"
        rows="2"
        [placeholder]="'admin.quickBooking.notesPlaceholder' | t"
        [ngModel]="notes()"
        (ngModelChange)="notes.set($event)"
        name="notes"
      ></textarea>
    </div>

    <div>
      <label class="block text-xs font-medium text-text-secondary mb-1.5">{{ 'admin.quickBooking.overtime' | t }}</label>
      <input
        type="number"
        class="w-full px-3 py-2 rounded-lg border border-border-color bg-bg-primary text-text-primary text-sm focus:outline-none focus:border-accent-green focus:ring-1 focus:ring-accent-green/30 transition-colors"
        placeholder="0"
        min="0"
        [ngModel]="overtimeMinutes()"
        (ngModelChange)="overtimeMinutes.set($event)"
        name="overtimeMinutes"
      />
    </div>

    @if (error()) {
      <div class="text-xs text-accent-red bg-accent-red/5 rounded-lg px-3 py-2">{{ error() }}</div>
    }

    @if (success()) {
      <div class="text-xs text-accent-green bg-accent-green/5 rounded-lg px-3 py-2">{{ success() }}</div>
    }

    <app-button
      type="submit"
      [label]="'admin.quickBooking.createBooking' | t"
      variant="primary"
      styleClass="w-full"
      [disabled]="!selectedUser() || !selectedService() || !selectedSlot() || isSubmitting()"
      [loading]="isSubmitting()"
    />
  </form>
</div>
