<div class="min-h-screen flex items-center justify-center gradient-page-bg px-4 py-8">
  <app-card variant="glass" styleClass="max-w-md w-full text-center">
    <!-- Success Checkmark Icon -->
    <div class="success-icon-wrapper mx-auto mb-6 mt-4">
      <div class="success-icon-circle animate-success-pop">
        <span class="success-checkmark animate-success-fade" aria-hidden="true">&#10003;</span>
      </div>
    </div>

    <!-- Heading -->
    <h1 class="text-3xl font-bold text-gray-900 mb-2">预约成功!</h1>
    <p class="text-gray-500 mb-2">您的预约已成功提交</p>

    <!-- Booking Reference -->
    <div class="mb-6">
      <p class="text-xs text-gray-400 mb-1">预约编号</p>
      <p class="text-sm font-mono font-bold text-primary-start tracking-wider">{{ bookingReference() }}</p>
    </div>

    <!-- Booking Details -->
    @if (selectedSlot(); as slot) {
      <div class="glass-level-1 p-5 mb-6 text-left">
        <h2 class="text-base font-semibold text-gray-800 mb-3">预约信息</h2>
        <dl class="space-y-2.5">
          <div class="flex justify-between text-sm">
            <dt class="text-gray-500">日期</dt>
            <dd class="font-medium text-gray-900">{{ slot.startTime | date: 'fullDate' }}</dd>
          </div>
          <div class="flex justify-between text-sm">
            <dt class="text-gray-500">时间</dt>
            <dd class="font-medium text-gray-900">{{ slot.startTime | date:'shortTime' }}</dd>
          </div>
        </dl>
      </div>
    } @else {
      <div class="glass-level-1 p-5 mb-6">
        <p class="text-gray-500 text-sm">暂无预约详情</p>
      </div>
    }

    <!-- Confirmation Email -->
    @if (currentUser(); as user) {
      <p class="text-sm text-gray-500 mb-8">
        确认邮件已发送至 <span class="font-medium text-gray-700">{{ user.email }}</span>
      </p>
    }

    <!-- Action Buttons -->
    <div class="space-y-3 pb-4">
      <app-button
        label="查看我的预约"
        variant="primary"
        class="w-full"
        (onClick)="viewMyBookings()"
      />
      <app-button
        label="返回首页"
        variant="secondary"
        class="w-full"
        (onClick)="goHome()"
      />
    </div>
  </app-card>
</div>
